appId: com.zane.zanebox
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn:
    id: com.android.permissioncontroller:id/permission_allow_button
    optional: true
- assertVisible:
    id: home_header
- tapOn:
    id: tab_2
- tapOn:
    id: settings_general
- tapOn:
    id: setting_appLanguage
- tapOn: 简体中文
- tapOn:
    id: setting_serviceMode
- tapOn: 本地代理
- tapOn:
    id: page_back
- tapOn:
    id: main_back
- tapOn:
    id: add_nodes
- tapOn: 导入文本
- tapOn:
    id: editor_field_0
- inputText: 'socks://10.0.2.2:19081#优化验收'
- tapOn:
    id: editor_save
- extendedWaitUntil:
    visible:
      text: 导入外部节点？
    timeout: 10000
- tapOn: "^导入$"
- extendedWaitUntil:
    visible: 优化验收
    timeout: 10000
- tapOn:
    id: connect_toggle
- extendedWaitUntil:
    visible: '代理开关：断开'
    timeout: 30000
- takeScreenshot: reports/ui-1.0.2/current/optimization-connected
- tapOn:
    id: tab_1
- scrollUntilVisible:
    element:
      id: smart_target_google
    direction: DOWN
    timeout: 10000
- tapOn:
    id: smart_target_google
- assertVisible: 关闭
- tapOn: 关闭
- extendedWaitUntil:
    visible: 关闭
    timeout: 10000
- tapOn:
    id: main_back
- extendedWaitUntil:
    visible: '代理开关：断开'
    timeout: 30000
- tapOn:
    id: connect_toggle
- extendedWaitUntil:
    visible: '代理开关：连接'
    timeout: 30000
- takeScreenshot: reports/ui-1.0.2/current/optimization-disconnected
